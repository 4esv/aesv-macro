# Builds the images aesv-macro runs on its host. A pull request into `aesv`
# proves the build; a push to `aesv` also publishes the images to ghcr.io,
# tagged with the commit and `aesv`.
name: aesv images

on:
  push:
    branches: [aesv]
  pull_request:
    branches: [aesv]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aesv-images-${{ github.ref }}
  cancel-in-progress: true

env:
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: services
            file: deploy/aesv/services.Dockerfile
          - name: sync-service
            file: docker/sync-service.Dockerfile
          - name: lexical-service
            file: docker/lexical-service.Dockerfile
          - name: websocket-service
            file: docker/websocket-service.Dockerfile
    steps:
      # NOTE: a release build of the workspace outgrows the runner's free disk.
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aesv-macro-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aesv-macro-${{ matrix.name }}:aesv
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
