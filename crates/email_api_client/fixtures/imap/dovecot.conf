# An IMAP server shaped like iCloud Mail for the iCloud adapter tests:
# iCloud's folder names, "/" as the separator, CONDSTORE and IDLE. Any user
# logs in with password "pass". Run it with `just icloud-mail-test-servers`.
mail_home=/srv/mail/%Lu
mail_location=sdbox:~/Mail
mail_uid=1000
mail_gid=1000
first_valid_uid = 1000
last_valid_uid = 1000
protocols = imap
listen = *
log_path=/dev/stdout

passdb {
  driver = static
  args = password=pass
}

ssl = yes
ssl_cert = <cert.pem
ssl_key = <key.pem
disable_plaintext_auth = no

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox "Sent Messages" {
    auto = subscribe
    special_use = \Sent
  }
  mailbox "Deleted Messages" {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  # No special-use flag, so the adapter must resolve Archive by its iCloud name.
  mailbox Archive {
    auto = subscribe
  }
}
